<section>

<h2 class="section-title">Contáctanos</h2>

<p class="section-subtitle">
Escríbenos y recibiré el mensaje directamente en Telegram.
</p>

<form id="form-contacto" class="contacto-form">

<label>Nombre</label>

<input
type="text"
id="nombre"
placeholder="Tu nombre"
required>

<label>Correo electrónico</label>

<input
type="email"
id="email"
placeholder="correo@ejemplo.com"
required>

<label>Mensaje</label>

<textarea
id="mensaje"
rows="6"
placeholder="Escribe tu mensaje..."
required></textarea>

<button type="submit">
Enviar mensaje
</button>

<p id="form-msg"></p>

</form>

</section>
